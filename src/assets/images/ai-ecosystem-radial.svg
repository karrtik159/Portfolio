<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none" role="img" aria-labelledby="aiEcoTitle aiEcoDesc">
  <title id="aiEcoTitle">AI systems ecosystem</title>
  <desc id="aiEcoDesc">Applications, Models, Infrastructure, and Data orbit a central AI Systems core.</desc>
  <style>
    .orbit {
      fill: none;
      stroke: var(--svg-muted, #3d4a44);
      stroke-width: 1;
      stroke-dasharray: 3 4;
      opacity: 0.55;
    }
    .spoke {
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1;
      stroke-dasharray: 2 3;
      opacity: 0.55;
    }
    .core {
      fill: var(--svg-surface-2, rgba(12, 92, 66, 0.12));
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1.5;
    }
    .node {
      fill: var(--svg-surface, rgba(12, 92, 66, 0.08));
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1.25;
    }
    .core-label {
      fill: var(--svg-ink, #17211c);
      font-family: Outfit, IBM Plex Sans, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .label {
      fill: var(--svg-ink, #17211c);
      font-family: Outfit, IBM Plex Sans, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }
    .sub {
      fill: var(--svg-muted, #3d4a44);
      font-family: IBM Plex Sans, Arial, sans-serif;
      font-size: 10px;
    }
    .icon {
      stroke: var(--svg-oxide, #0c5c42);
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
  </style>

  <circle class="orbit" cx="210" cy="210" r="128"/>
  <circle class="core" cx="210" cy="210" r="48"/>
  <text class="core-label" x="210" y="204" text-anchor="middle" dominant-baseline="central">AI</text>
  <text class="core-label" x="210" y="220" text-anchor="middle" dominant-baseline="central">SYSTEMS</text>

  <line class="spoke" x1="210" y1="162" x2="210" y2="98"/>
  <line class="spoke" x1="258" y1="210" x2="322" y2="210"/>
  <line class="spoke" x1="210" y1="258" x2="210" y2="322"/>
  <line class="spoke" x1="162" y1="210" x2="98" y2="210"/>

  <!-- Top: Applications — content centered in node -->
  <g transform="translate(148 24)">
    <rect class="node" width="124" height="64"/>
    <g class="icon" transform="translate(50 10)">
      <rect width="8" height="8"/><rect x="12" width="8" height="8"/>
      <rect y="12" width="8" height="8"/><rect x="12" y="12" width="8" height="8"/>
    </g>
    <text class="label" x="62" y="42" text-anchor="middle" dominant-baseline="central">Applications</text>
    <text class="sub" x="62" y="56" text-anchor="middle" dominant-baseline="central">Web, APIs, Agents</text>
  </g>

  <!-- Right: Models -->
  <g transform="translate(330 178)">
    <rect class="node" width="82" height="64"/>
    <g class="icon" transform="translate(32 8)">
      <circle cx="9" cy="9" r="8"/>
      <circle cx="6" cy="8" r="1.2"/><circle cx="12" cy="8" r="1.2"/>
    </g>
    <text class="label" x="41" y="40" text-anchor="middle" dominant-baseline="central">Models</text>
    <text class="sub" x="41" y="54" text-anchor="middle" dominant-baseline="central">RAG, CV, ML</text>
  </g>

  <!-- Bottom: Infrastructure -->
  <g transform="translate(148 332)">
    <rect class="node" width="124" height="64"/>
    <g class="icon" transform="translate(50 10)">
      <path d="M6 16h14a6 6 0 0 0 0-12 7 7 0 0 0-13.5 2.5A5 5 0 0 0 6 16z"/>
    </g>
    <text class="label" x="62" y="42" text-anchor="middle" dominant-baseline="central">Infrastructure</text>
    <text class="sub" x="62" y="56" text-anchor="middle" dominant-baseline="central">Cloud, GPU, Prod</text>
  </g>

  <!-- Left: Data -->
  <g transform="translate(8 178)">
    <rect class="node" width="82" height="64"/>
    <g class="icon" transform="translate(32 6)">
      <ellipse cx="9" cy="4" rx="8" ry="3"/>
      <path d="M1 4v5c0 1.6 3.6 3 8 3s8-1.4 8-3V4"/>
      <path d="M1 9v5c0 1.6 3.6 3 8 3s8-1.4 8-3V9"/>
    </g>
    <text class="label" x="41" y="40" text-anchor="middle" dominant-baseline="central">Data</text>
    <text class="sub" x="41" y="54" text-anchor="middle" dominant-baseline="central">Docs, DBs</text>
  </g>
</svg>
