<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" fill="none" role="img" aria-labelledby="aiWorkTitle aiWorkDesc">
  <title id="aiWorkTitle">AI workflow loop</title>
  <desc id="aiWorkDesc">Collect, Understand, Reason, and Deliver, with a feedback and improvement loop.</desc>
  <style>
    .step {
      fill: var(--svg-surface, rgba(12, 92, 66, 0.08));
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1.25;
    }
    .label {
      fill: var(--svg-ink, #17211c);
      font-family: Outfit, IBM Plex Sans, Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .sub {
      fill: var(--svg-muted, #3d4a44);
      font-family: IBM Plex Sans, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
    }
    .icon {
      stroke: var(--svg-oxide, #0c5c42);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .arrow {
      stroke: var(--svg-oxide, #0c5c42);
      fill: none;
      stroke-width: 1.5;
    }
    .arrowhead { fill: var(--svg-oxide, #0c5c42); }
    .feedback {
      fill: var(--svg-ink, #17211c);
      font-family: IBM Plex Sans, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
    }
  </style>

  <!-- Collect -->
  <g>
    <rect class="step" x="20" y="20" width="148" height="124"/>
    <g class="icon" transform="translate(82 38)">
      <rect x="2" y="0" width="14" height="18"/>
      <rect x="6" y="4" width="14" height="18"/>
      <path d="M10 10h6M10 14h6"/>
    </g>
    <text class="label" x="94" y="92" text-anchor="middle" dominant-baseline="central">Collect</text>
    <text class="sub" x="94" y="118" text-anchor="middle">
      <tspan x="94" dy="0">Docs, images,</tspan>
      <tspan x="94" dy="13">APIs</tspan>
    </text>
  </g>

  <!-- Understand -->
  <g>
    <rect class="step" x="198" y="20" width="148" height="124"/>
    <g class="icon" transform="translate(260 40)">
      <circle cx="12" cy="12" r="3"/>
      <circle cx="2" cy="4" r="2"/>
      <circle cx="22" cy="4" r="2"/>
      <circle cx="2" cy="20" r="2"/>
      <circle cx="22" cy="20" r="2"/>
      <path d="M4 5l6 5M20 5l-6 5M4 19l6-5M20 19l-6-5"/>
    </g>
    <text class="label" x="272" y="92" text-anchor="middle" dominant-baseline="central">Understand</text>
    <text class="sub" x="272" y="118" text-anchor="middle">
      <tspan x="272" dy="0">Parse, chunk,</tspan>
      <tspan x="272" dy="13">embed</tspan>
    </text>
  </g>

  <!-- Reason -->
  <g>
    <rect class="step" x="376" y="20" width="148" height="124"/>
    <g class="icon" transform="translate(438 40)">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="8" cy="11" r="1.5"/>
      <circle cx="16" cy="11" r="1.5"/>
      <path d="M8 16c1.8 2.2 6.2 2.2 8 0"/>
    </g>
    <text class="label" x="450" y="92" text-anchor="middle" dominant-baseline="central">Reason</text>
    <text class="sub" x="450" y="118" text-anchor="middle">
      <tspan x="450" dy="0">RAG, Agents,</tspan>
      <tspan x="450" dy="13">eval</tspan>
    </text>
  </g>

  <!-- Deliver -->
  <g>
    <rect class="step" x="554" y="20" width="148" height="124"/>
    <g class="icon" transform="translate(616 40)">
      <rect x="1" y="3" width="22" height="16"/>
      <path d="M1 8h22"/>
      <path d="M5 12h8M5 15h5"/>
    </g>
    <text class="label" x="628" y="92" text-anchor="middle" dominant-baseline="central">Deliver</text>
    <text class="sub" x="628" y="118" text-anchor="middle">
      <tspan x="628" dy="0">Apps,</tspan>
      <tspan x="628" dy="13">automation</tspan>
    </text>
  </g>

  <!-- Forward arrows between panels -->
  <g>
    <path class="arrow" d="M172 82h20"/>
    <polygon class="arrowhead" points="192,82 182,77 182,87"/>
    <path class="arrow" d="M350 82h20"/>
    <polygon class="arrowhead" points="370,82 360,77 360,87"/>
    <path class="arrow" d="M528 82h20"/>
    <polygon class="arrowhead" points="548,82 538,77 538,87"/>
  </g>

  <!-- Feedback loop -->
  <path class="arrow" d="M628 154v28H94v-28" stroke-dasharray="3 3"/>
  <polygon class="arrowhead" points="94,154 89,164 99,164"/>
  <text class="feedback" x="360" y="214" text-anchor="middle" dominant-baseline="central">Feedback and improvement</text>
</svg>
