<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" fill="none" role="img" aria-labelledby="aiStackTitle aiStackDesc">
  <title id="aiStackTitle">AI systems layered stack</title>
  <desc id="aiStackDesc">Four layers from Applications through AI Systems, Data and Knowledge, to Infrastructure.</desc>
  <style>
    .panel {
      fill: var(--svg-surface, rgba(12, 92, 66, 0.07));
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1.25;
    }
    .panel-2 { fill: var(--svg-surface-2, rgba(12, 92, 66, 0.055)); }
    .panel-3 { fill: var(--svg-surface-3, rgba(12, 92, 66, 0.04)); }
    .panel-4 { fill: var(--svg-surface-4, rgba(12, 92, 66, 0.03)); }
    .label {
      fill: var(--svg-ink, #17211c);
      font-family: Outfit, IBM Plex Sans, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
    }
    .sub {
      fill: var(--svg-muted, #3d4a44);
      font-family: IBM Plex Sans, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
    }
    .icon {
      stroke: var(--svg-oxide, #0c5c42);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
  </style>

  <!-- Layer 1: Applications -->
  <g>
    <rect class="panel" x="16" y="12" width="328" height="60"/>
    <g class="icon" transform="translate(36 30)">
      <rect x="0" y="0" width="10" height="10"/>
      <rect x="14" y="0" width="10" height="10"/>
      <rect x="0" y="14" width="10" height="10"/>
      <rect x="14" y="14" width="10" height="10"/>
    </g>
    <text class="label" x="78" y="36" dominant-baseline="central">Applications</text>
    <text class="sub" x="78" y="54" dominant-baseline="central">Web, APIs, Agents</text>
  </g>

  <!-- Layer 2: AI Systems -->
  <g>
    <rect class="panel panel-2" x="16" y="80" width="328" height="60"/>
    <g class="icon" transform="translate(38 94)">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="7" cy="11" r="1.6"/>
      <circle cx="17" cy="11" r="1.6"/>
      <path d="M8 16c1.6 2 6.4 2 8 0"/>
    </g>
    <text class="label" x="78" y="104" dominant-baseline="central">AI Systems</text>
    <text class="sub" x="78" y="122" dominant-baseline="central">RAG, Agents, CV, ML</text>
  </g>

  <!-- Layer 3: Data and Knowledge -->
  <g>
    <rect class="panel panel-3" x="16" y="148" width="328" height="60"/>
    <g class="icon" transform="translate(38 162)">
      <ellipse cx="12" cy="6" rx="12" ry="4"/>
      <path d="M0 6v6c0 2.2 5.4 4 12 4s12-1.8 12-4V6"/>
      <path d="M0 12v6c0 2.2 5.4 4 12 4s12-1.8 12-4v-6"/>
    </g>
    <text class="label" x="78" y="172" dominant-baseline="central">Data and Knowledge</text>
    <text class="sub" x="78" y="190" dominant-baseline="central">Documents, Images, Databases</text>
  </g>

  <!-- Layer 4: Infrastructure -->
  <g>
    <rect class="panel panel-4" x="16" y="216" width="328" height="60"/>
    <g class="icon" transform="translate(38 230)">
      <path d="M8 20h16a8 8 0 0 0 0-16 9 9 0 0 0-17.2 3A6 6 0 0 0 8 20z"/>
    </g>
    <text class="label" x="78" y="240" dominant-baseline="central">Infrastructure</text>
    <text class="sub" x="78" y="258" dominant-baseline="central">Cloud, GPU, Production</text>
  </g>
</svg>
