<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" fill="none" role="img" aria-labelledby="aiPipeTitle aiPipeDesc">
  <title id="aiPipeTitle">AI pipeline flow</title>
  <desc id="aiPipeDesc">Data sources flow into AI processing, then into real-world applications.</desc>
  <style>
    .col {
      fill: var(--svg-surface, rgba(12, 92, 66, 0.07));
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1.25;
    }
    .col-mid {
      fill: var(--svg-surface-2, rgba(12, 92, 66, 0.11));
    }
    .head {
      fill: var(--svg-ink, #17211c);
      font-family: Outfit, IBM Plex Sans, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
    }
    .item {
      fill: var(--svg-ink, #17211c);
      font-family: IBM Plex Sans, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
    }
    .icon {
      stroke: var(--svg-oxide, #0c5c42);
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .arrow {
      stroke: var(--svg-oxide, #0c5c42);
      fill: none;
      stroke-width: 1.5;
    }
    .arrowhead { fill: var(--svg-oxide, #0c5c42); }
    .row-line {
      stroke: var(--svg-oxide, #0c5c42);
      stroke-width: 1;
      opacity: 0.18;
    }
  </style>

  <!-- Equal columns: 200 wide, 24 gap, 36 side pad → 36+200+24+200+24+200+36 = 720 -->
  <rect class="col" x="36" y="44" width="200" height="244"/>
  <rect class="col col-mid" x="260" y="44" width="200" height="244"/>
  <rect class="col" x="484" y="44" width="200" height="244"/>

  <text class="head" x="136" y="28" text-anchor="middle" dominant-baseline="central">Data Sources</text>
  <text class="head" x="360" y="28" text-anchor="middle" dominant-baseline="central">AI Processing</text>
  <text class="head" x="584" y="28" text-anchor="middle" dominant-baseline="central">Applications</text>

  <!-- Row dividers -->
  <g class="row-line">
    <line x1="36" y1="92" x2="236" y2="92"/>
    <line x1="36" y1="140" x2="236" y2="140"/>
    <line x1="36" y1="188" x2="236" y2="188"/>
    <line x1="36" y1="236" x2="236" y2="236"/>
    <line x1="260" y1="92" x2="460" y2="92"/>
    <line x1="260" y1="140" x2="460" y2="140"/>
    <line x1="260" y1="188" x2="460" y2="188"/>
    <line x1="260" y1="236" x2="460" y2="236"/>
    <line x1="484" y1="92" x2="684" y2="92"/>
    <line x1="484" y1="140" x2="684" y2="140"/>
    <line x1="484" y1="188" x2="684" y2="188"/>
    <line x1="484" y1="236" x2="684" y2="236"/>
  </g>

  <!-- Sources rows (center of each 48px band) -->
  <g>
    <g class="icon" transform="translate(56 58)"><rect x="2" y="0" width="14" height="18"/><path d="M6 6h6M6 10h6M6 14h4"/></g>
    <text class="item" x="88" y="68" dominant-baseline="central">Documents</text>

    <g class="icon" transform="translate(56 106)"><rect x="1" y="3" width="16" height="12"/><circle cx="6" cy="8" r="1.5"/><path d="M1 13l5-5 4 3 5-6"/></g>
    <text class="item" x="88" y="116" dominant-baseline="central">Images</text>

    <g class="icon" transform="translate(56 154)"><ellipse cx="9" cy="4" rx="8" ry="3"/><path d="M1 4v6c0 1.7 3.6 3 8 3s8-1.3 8-3V4"/><path d="M1 10v4c0 1.7 3.6 3 8 3s8-1.3 8-3v-4"/></g>
    <text class="item" x="88" y="164" dominant-baseline="central">Databases</text>

    <g class="icon" transform="translate(56 202)"><path d="M4 6h4l2-4 2 8 2-4h4"/><circle cx="3" cy="14" r="2"/><circle cx="15" cy="14" r="2"/></g>
    <text class="item" x="88" y="212" dominant-baseline="central">APIs</text>

    <g class="icon" transform="translate(56 250)"><path d="M2 14c4-8 10-8 14 0"/><path d="M5 14c2.5-4 5.5-4 8 0"/><circle cx="9" cy="6" r="2"/></g>
    <text class="item" x="88" y="260" dominant-baseline="central">Sensor data</text>
  </g>

  <!-- Processing rows -->
  <g>
    <g class="icon" transform="translate(280 58)"><rect x="2" y="0" width="12" height="16"/><circle cx="14" cy="14" r="4"/><path d="M16.5 16.5l3 3"/></g>
    <text class="item" x="312" y="68" dominant-baseline="central">Ingest and parse</text>

    <g class="icon" transform="translate(280 106)"><rect x="1" y="1" width="16" height="16"/><path d="M5 9h8M9 5v8"/></g>
    <text class="item" x="312" y="116" dominant-baseline="central">Embed and index</text>

    <g class="icon" transform="translate(280 154)"><circle cx="8" cy="8" r="6"/><path d="M12.5 12.5l5 5"/></g>
    <text class="item" x="312" y="164" dominant-baseline="central">Retrieve and rank</text>

    <g class="icon" transform="translate(280 202)"><circle cx="9" cy="9" r="8"/><circle cx="6" cy="8" r="1.5"/><circle cx="12" cy="8" r="1.5"/><path d="M6 13c1.5 2 4.5 2 6 0"/></g>
    <text class="item" x="312" y="212" dominant-baseline="central">LLM / Agents</text>

    <g class="icon" transform="translate(280 250)"><path d="M2 14V4h12v10"/><path d="M6 14v4h4v-4"/><path d="M5 8h6"/></g>
    <text class="item" x="312" y="260" dominant-baseline="central">Eval loop</text>
  </g>

  <!-- Applications rows -->
  <g>
    <g class="icon" transform="translate(504 58)"><path d="M2 4h12v10H8l-3 4v-4H2z"/></g>
    <text class="item" x="536" y="68" dominant-baseline="central">Chatbots</text>

    <g class="icon" transform="translate(504 106)"><circle cx="9" cy="9" r="7"/><circle cx="9" cy="9" r="2.5"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2"/></g>
    <text class="item" x="536" y="116" dominant-baseline="central">Automation</text>

    <g class="icon" transform="translate(504 154)"><path d="M2 16V8l4 4 4-8 4 8v4"/></g>
    <text class="item" x="536" y="164" dominant-baseline="central">Analytics</text>

    <g class="icon" transform="translate(504 202)"><circle cx="9" cy="9" r="6"/><circle cx="9" cy="9" r="2.5"/><path d="M3 15h12"/></g>
    <text class="item" x="536" y="212" dominant-baseline="central">Vision systems</text>

    <g class="icon" transform="translate(504 250)"><path d="M9 2l5 14H4z"/><circle cx="9" cy="11" r="1.5"/></g>
    <text class="item" x="536" y="260" dominant-baseline="central">Decision support</text>
  </g>

  <!-- Flow arrows in the 24px gutters -->
  <g>
    <path class="arrow" d="M240 166h16"/>
    <polygon class="arrowhead" points="256,166 246,161 246,171"/>
    <path class="arrow" d="M464 166h16"/>
    <polygon class="arrowhead" points="480,166 470,161 470,171"/>
  </g>
</svg>
